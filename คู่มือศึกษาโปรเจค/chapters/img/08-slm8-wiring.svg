<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="660" viewBox="0 0 1140 660" font-family="Sarabun, Tahoma, 'Leelawadee UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1140" height="660" fill="#FFFFFF"/>
  <text x="36" y="40" font-size="21" font-weight="700" fill="#17241D">การต่อ ESP32 เข้ากับสายควบคุม Daikin SLM8 (ตอนถอด panel ออก)</text>
  <text x="36" y="64" font-size="12.5" fill="#66766E">ระบุสายตามหน้าที่ ไม่ใช่ตามสี · GND ต้องร่วมกัน · สายแดง +5V ไม่ต่อ · ไม่มีขา ESP32 ตัวไหนดันไฟเข้าสายแอร์</text>

  <!-- AC box -->
  <rect x="40" y="96" width="270" height="490" rx="14" fill="#F3F6F4" stroke="#17241D" stroke-width="1.5"/>
  <text x="175" y="124" font-size="15" font-weight="700" fill="#17241D" text-anchor="middle">เครื่องแอร์ Daikin</text>
  <text x="175" y="143" font-size="12" fill="#66766E" text-anchor="middle">(ด้านในตัวเครื่อง)</text>
  <!-- internal 5V rail -->
  <line x1="90" y1="170" x2="90" y2="470" stroke="#DC4C5C" stroke-width="2"/>
  <text x="62" y="165" font-size="11.5" fill="#DC4C5C">5 V</text>
  <!-- pull-up cmd -->
  <line x1="90" y1="270" x2="140" y2="270" stroke="#17241D" stroke-width="2"/>
  <rect x="140" y="260" width="70" height="20" rx="3" fill="#FFFFFF" stroke="#17241D" stroke-width="1.5"/>
  <text x="175" y="252" font-size="11.5" fill="#17241D" text-anchor="middle">ดึงขึ้น ≈ 56k</text>
  <line x1="210" y1="270" x2="310" y2="270" stroke="#17241D" stroke-width="2"/>
  <text x="175" y="300" font-size="11.5" fill="#0D7A4B" text-anchor="middle">ตัวรับ: แอร์ "ฟัง"</text>
  <!-- pull-up status -->
  <line x1="90" y1="430" x2="140" y2="430" stroke="#17241D" stroke-width="2"/>
  <rect x="140" y="420" width="70" height="20" rx="3" fill="#FFFFFF" stroke="#17241D" stroke-width="1.5"/>
  <text x="175" y="412" font-size="11.5" fill="#17241D" text-anchor="middle">ดึงขึ้น ≈ 21k</text>
  <line x1="210" y1="430" x2="310" y2="430" stroke="#17241D" stroke-width="2"/>
  <text x="175" y="460" font-size="11.5" fill="#2F6FB5" text-anchor="middle">ตัวส่ง open collector: แอร์ "พูด"</text>
  <line x1="90" y1="170" x2="310" y2="170" stroke="#DC4C5C" stroke-width="2"/>
  <line x1="60" y1="540" x2="310" y2="540" stroke="#17241D" stroke-width="2"/>
  <text x="100" y="530" font-size="11.5" fill="#17241D">GND</text>

  <!-- wire labels -->
  <text x="320" y="162" font-size="12.5" font-weight="700" fill="#DC4C5C">แดง +5V</text>
  <text x="320" y="262" font-size="12.5" font-weight="700" fill="#0D7A4B">สายคำสั่ง (panel → แอร์)</text>
  <text x="320" y="422" font-size="12.5" font-weight="700" fill="#2F6FB5">สายสถานะ (แอร์ → panel)</text>
  <text x="320" y="532" font-size="12.5" font-weight="700" fill="#17241D">ดำ GND</text>

  <!-- +5V not connected -->
  <line x1="310" y1="170" x2="420" y2="170" stroke="#DC4C5C" stroke-width="2"/>
  <line x1="410" y1="160" x2="430" y2="180" stroke="#DC4C5C" stroke-width="3"/>
  <line x1="430" y1="160" x2="410" y2="180" stroke="#DC4C5C" stroke-width="3"/>
  <text x="442" y="175" font-size="12.5" fill="#DC4C5C">ไม่ต่อ (ใช้ไฟ USB ของ ESP32 เอง)</text>

  <!-- command line -->
  <line x1="310" y1="270" x2="470" y2="270" stroke="#0D7A4B" stroke-width="2.5"/>
  <circle cx="470" cy="270" r="4.5" fill="#0D7A4B"/>
  <!-- diode branch -->
  <line x1="470" y1="270" x2="470" y2="220" stroke="#0D7A4B" stroke-width="2.5"/>
  <line x1="470" y1="220" x2="610" y2="220" stroke="#0D7A4B" stroke-width="2.5"/>
  <path d="M610,206 L638,220 L610,234 Z" fill="#17241D"/>
  <line x1="640" y1="205" x2="640" y2="235" stroke="#17241D" stroke-width="3"/>
  <line x1="640" y1="220" x2="880" y2="220" stroke="#17241D" stroke-width="2"/>
  <text x="625" y="198" font-size="12" fill="#17241D" text-anchor="middle">1N4148 (ขีดดำหันหา ESP32)</text>
  <text x="755" y="212" font-size="11.5" fill="#66766E" text-anchor="middle">ส่ง: GPIO33 = LOW → ดึงสายลง</text>
  <!-- divider cmd -->
  <line x1="470" y1="270" x2="470" y2="310" stroke="#0D7A4B" stroke-width="2.5"/>
  <line x1="470" y1="310" x2="520" y2="310" stroke="#0D7A4B" stroke-width="2.5"/>
  <rect x="520" y="300" width="80" height="20" rx="3" fill="#FFFFFF" stroke="#17241D" stroke-width="1.5"/>
  <text x="560" y="295" font-size="12" fill="#17241D" text-anchor="middle">R1 100k</text>
  <line x1="600" y1="310" x2="720" y2="310" stroke="#17241D" stroke-width="2"/>
  <circle cx="720" cy="310" r="4.5" fill="#17241D"/>
  <line x1="720" y1="310" x2="880" y2="310" stroke="#17241D" stroke-width="2"/>
  <line x1="720" y1="310" x2="720" y2="325" stroke="#17241D" stroke-width="2"/>
  <rect x="710" y="325" width="20" height="50" rx="3" fill="#FFFFFF" stroke="#17241D" stroke-width="1.5"/>
  <text x="740" y="355" font-size="12" fill="#17241D">R2 200k</text>
  <line x1="720" y1="375" x2="720" y2="385" stroke="#17241D" stroke-width="2"/>
  <line x1="706" y1="385" x2="734" y2="385" stroke="#17241D" stroke-width="2"/>
  <line x1="711" y1="390" x2="729" y2="390" stroke="#17241D" stroke-width="2"/>
  <line x1="716" y1="395" x2="724" y2="395" stroke="#17241D" stroke-width="2"/>
  <text x="800" y="302" font-size="11.5" fill="#66766E" text-anchor="middle">≈ 2.8 V (อ่าน echo)</text>

  <!-- status line -->
  <line x1="310" y1="430" x2="470" y2="430" stroke="#2F6FB5" stroke-width="2.5"/>
  <line x1="470" y1="430" x2="520" y2="430" stroke="#2F6FB5" stroke-width="2.5"/>
  <rect x="520" y="420" width="80" height="20" rx="3" fill="#FFFFFF" stroke="#17241D" stroke-width="1.5"/>
  <text x="560" y="415" font-size="12" fill="#17241D" text-anchor="middle">R1 100k</text>
  <line x1="600" y1="430" x2="720" y2="430" stroke="#17241D" stroke-width="2"/>
  <circle cx="720" cy="430" r="4.5" fill="#17241D"/>
  <line x1="720" y1="430" x2="880" y2="430" stroke="#17241D" stroke-width="2"/>
  <line x1="720" y1="430" x2="720" y2="445" stroke="#17241D" stroke-width="2"/>
  <rect x="710" y="445" width="20" height="50" rx="3" fill="#FFFFFF" stroke="#17241D" stroke-width="1.5"/>
  <text x="740" y="475" font-size="12" fill="#17241D">R2 200k</text>
  <line x1="720" y1="495" x2="720" y2="505" stroke="#17241D" stroke-width="2"/>
  <line x1="706" y1="505" x2="734" y2="505" stroke="#17241D" stroke-width="2"/>
  <line x1="711" y1="510" x2="729" y2="510" stroke="#17241D" stroke-width="2"/>
  <line x1="716" y1="515" x2="724" y2="515" stroke="#17241D" stroke-width="2"/>
  <text x="800" y="422" font-size="11.5" fill="#66766E" text-anchor="middle">≈ 3.1 V (อ่านสถานะ)</text>

  <!-- GND -->
  <line x1="310" y1="540" x2="880" y2="540" stroke="#17241D" stroke-width="2.5"/>

  <!-- ESP32 box -->
  <rect x="880" y="96" width="220" height="490" rx="14" fill="#EAF4EE" stroke="#0D7A4B" stroke-width="1.5"/>
  <text x="990" y="124" font-size="15" font-weight="700" fill="#0D7A4B" text-anchor="middle">ESP32 DevKit</text>
  <text x="990" y="143" font-size="12" fill="#66766E" text-anchor="middle">ทำงานที่ 3.3 V</text>
  <text x="896" y="225" font-size="13" font-weight="700" fill="#17241D">GPIO33</text>
  <text x="896" y="242" font-size="11" fill="#66766E">ขาส่ง (ผ่านไดโอดเท่านั้น)</text>
  <text x="896" y="315" font-size="13" font-weight="700" fill="#17241D">GPIO34</text>
  <text x="896" y="332" font-size="11" fill="#66766E">ขารับอย่างเดียว · echo</text>
  <text x="896" y="435" font-size="13" font-weight="700" fill="#17241D">GPIO35</text>
  <text x="896" y="452" font-size="11" fill="#66766E">ขารับอย่างเดียว · สถานะ</text>
  <text x="896" y="545" font-size="13" font-weight="700" fill="#17241D">GND</text>

  <text x="36" y="616" font-size="12.5" fill="#17241D">ทางเลือกแทนไดโอด: 2N2222 · GPIO33 → 1k → ขา B, ขา C → สายคำสั่ง, ขา E → GND (สัญญาณกลับขั้ว ต้องตั้ง BUS_TX_INVERT = true)</text>
  <text x="36" y="638" font-size="12.5" fill="#66766E">ตัวเลข "ดึงขึ้น" คำนวณจากแรงดันที่ตกตอนต่อตัวแบ่ง 10k/20k · แรงดันที่ขาคำนวณจากตัวแบ่ง 100k/200k</text>
</svg>
