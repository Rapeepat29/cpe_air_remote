<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="560" viewBox="0 0 1140 560" font-family="Sarabun, Tahoma, 'Leelawadee UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1140" height="560" fill="#FFFFFF"/>
  <text x="36" y="40" font-size="21" font-weight="700" fill="#17241D">รูปคลื่น 1 เฟรมบนสาย SLM8 (pulse-distance)</text>
  <text x="36" y="64" font-size="12.5" fill="#66766E">ช่วง header และบิตวาดตามสัดส่วน 1 px = 10 µs · ช่วงท้ายเฟรมย่อไว้ (เส้นหยัก)</text>

  <!-- levels -->
  <text x="36" y="124" font-size="12" fill="#66766E">HIGH ≈ 5 V</text>
  <text x="36" y="194" font-size="12" fill="#66766E">LOW 0 V</text>
  <line x1="110" y1="120" x2="1110" y2="120" stroke="#E2E8E4" stroke-dasharray="3 4"/>
  <line x1="110" y1="190" x2="1110" y2="190" stroke="#E2E8E4" stroke-dasharray="3 4"/>

  <!-- waveform -->
  <polyline fill="none" stroke="#0D7A4B" stroke-width="3" stroke-linejoin="round" points="
    110,120 150,120 150,190 410,190 410,120 505,120
    505,190 542,190 542,120 579,120
    579,190 617,190 617,120 709,120
    709,190 746,190 746,120 783,120"/>
  <line x1="783" y1="120" x2="840" y2="120" stroke="#0D7A4B" stroke-width="3" stroke-dasharray="6 6"/>
  <polyline fill="none" stroke="#0D7A4B" stroke-width="3" stroke-linejoin="round" points="
    840,120 840,190 877,190 877,120 930,120"/>
  <path d="M930,108 l8,24 M942,108 l8,24" stroke="#66766E" stroke-width="2"/>
  <polyline fill="none" stroke="#0D7A4B" stroke-width="3" stroke-linejoin="round" points="
    950,120 990,120 990,190 1030,190 1030,120 1070,120"/>
  <path d="M1072,108 l8,24 M1084,108 l8,24" stroke="#66766E" stroke-width="2"/>
  <line x1="1092" y1="120" x2="1110" y2="120" stroke="#0D7A4B" stroke-width="3"/>

  <!-- region labels -->
  <rect x="150" y="214" width="355" height="26" rx="6" fill="#EAF4EE"/>
  <text x="327" y="232" font-size="13" font-weight="700" fill="#0D7A4B" text-anchor="middle">Header</text>
  <rect x="505" y="214" width="335" height="26" rx="6" fill="#E8F0FA"/>
  <text x="672" y="232" font-size="13" font-weight="700" fill="#2F6FB5" text-anchor="middle">64 บิตข้อมูล</text>
  <rect x="840" y="214" width="252" height="26" rx="6" fill="#FBEDEF"/>
  <text x="966" y="232" font-size="13" font-weight="700" fill="#DC4C5C" text-anchor="middle">ท้ายเฟรม</text>

  <!-- timing labels -->
  <text x="280" y="182" font-size="12.5" fill="#17241D" text-anchor="middle">LOW 2600 µs</text>
  <text x="457" y="112" font-size="12.5" fill="#17241D" text-anchor="middle">HIGH 950</text>
  <text x="560" y="96" font-size="12.5" font-weight="700" fill="#2F6FB5" text-anchor="middle">0</text>
  <text x="560" y="112" font-size="11" fill="#17241D" text-anchor="middle">370</text>
  <text x="663" y="96" font-size="12.5" font-weight="700" fill="#2F6FB5" text-anchor="middle">1</text>
  <text x="663" y="112" font-size="11" fill="#17241D" text-anchor="middle">920</text>
  <text x="764" y="96" font-size="12.5" font-weight="700" fill="#2F6FB5" text-anchor="middle">0</text>
  <text x="523" y="207" font-size="11" fill="#17241D" text-anchor="middle">375</text>
  <text x="598" y="207" font-size="11" fill="#17241D" text-anchor="middle">375</text>
  <text x="811" y="112" font-size="11" fill="#66766E" text-anchor="middle">…</text>
  <text x="900" y="112" font-size="11.5" fill="#17241D" text-anchor="middle">HIGH ≈16 ms</text>
  <text x="1010" y="207" font-size="11.5" fill="#17241D" text-anchor="middle">LOW ≈2 ms</text>
  <text x="1095" y="96" font-size="11.5" fill="#17241D" text-anchor="end">ว่าง ≈0.92 s</text>

  <!-- rule box -->
  <rect x="36" y="268" width="1068" height="78" rx="10" fill="#F3F6F4"/>
  <text x="56" y="296" font-size="14" font-weight="700" fill="#17241D">กติกาอ่านบิต</text>
  <text x="56" y="322" font-size="13" fill="#17241D">ทุกบิตเริ่มด้วย LOW ยาวเท่ากัน (~375 µs) ค่าบิตดูจาก "ช่วง HIGH ที่ตามมา": 200–600 µs = 0 · 650–1400 µs = 1 · นอกช่วงทิ้งเฟรม</text>
  <text x="56" y="338" font-size="12" fill="#66766E">เกณฑ์อยู่รอบจุดกึ่งกลางระหว่าง 370 กับ 920 (ช่อง 600–650 เว้นไว้กันกำกวม) ตามโค้ดจริงใน DaikinSLM8.h</text>

  <!-- LSB first -->
  <text x="36" y="384" font-size="15" font-weight="700" fill="#17241D">LSB first: ไบต์ 0x20 (ตั้ง 20°C) ส่งออกสายตามลำดับนี้</text>
  <g font-size="13" text-anchor="middle">
    <g fill="#17241D">
      <text x="86" y="412">ลำดับส่ง →</text>
    </g>
    <rect x="160" y="396" width="70" height="44" rx="6" fill="#FFFFFF" stroke="#17241D"/><text x="195" y="424">0</text>
    <rect x="236" y="396" width="70" height="44" rx="6" fill="#FFFFFF" stroke="#17241D"/><text x="271" y="424">0</text>
    <rect x="312" y="396" width="70" height="44" rx="6" fill="#FFFFFF" stroke="#17241D"/><text x="347" y="424">0</text>
    <rect x="388" y="396" width="70" height="44" rx="6" fill="#FFFFFF" stroke="#17241D"/><text x="423" y="424">0</text>
    <rect x="464" y="396" width="70" height="44" rx="6" fill="#FFFFFF" stroke="#17241D"/><text x="499" y="424">0</text>
    <rect x="540" y="396" width="70" height="44" rx="6" fill="#EAF4EE" stroke="#0D7A4B"/><text x="575" y="424" font-weight="700" fill="#0D7A4B">1</text>
    <rect x="616" y="396" width="70" height="44" rx="6" fill="#FFFFFF" stroke="#17241D"/><text x="651" y="424">0</text>
    <rect x="692" y="396" width="70" height="44" rx="6" fill="#FFFFFF" stroke="#17241D"/><text x="727" y="424">0</text>
    <g fill="#66766E" font-size="11.5">
      <text x="195" y="458">บิต 0 (ค่า 1)</text><text x="271" y="458">บิต 1 (2)</text><text x="347" y="458">บิต 2 (4)</text><text x="423" y="458">บิต 3 (8)</text>
      <text x="499" y="458">บิต 4 (16)</text><text x="575" y="458">บิต 5 (32)</text><text x="651" y="458">บิต 6 (64)</text><text x="727" y="458">บิต 7 (128)</text>
    </g>
  </g>
  <text x="790" y="416" font-size="13" fill="#17241D">บิต 5 = 1 → 32 = 0x20 ✓</text>
  <text x="790" y="436" font-size="12" fill="#66766E">ถ้าอ่านกลับด้าน (MSB first) จะได้ 0x04 ผิด</text>

  <text x="36" y="500" font-size="13" fill="#17241D">ความยาวทั้งเฟรม: header 3.55 ms + บิต 0 ใช้ 0.745 ms + บิต 1 ใช้ 1.295 ms → เฟรมจริงราว 55–58 ms (ขึ้นกับจำนวนบิต 1)</text>
  <text x="36" y="522" font-size="13" fill="#17241D">ตามด้วยท้ายเฟรม ≈18 ms แล้วสายว่างจนครบรอบ ≈1 วินาที · ใช้สายจริงแค่ราว 7–8% ของเวลา</text>
</svg>
