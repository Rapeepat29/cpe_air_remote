<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" font-family="Sarabun, Tahoma, 'Leelawadee UI', monospace">
  <defs>
    <marker id="fk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4678B8"/>
    </marker>
  </defs>
  <rect width="1180" height="900" fill="#FFFFFF"/>

  <text x="36" y="44" font-size="22" font-weight="700" fill="#17241D">แผนผังฐานข้อมูล · 8 ตาราง</text>
  <text x="36" y="68" font-size="13" fill="#66766E">เส้นน้ำเงิน = FOREIGN KEY · PK = คีย์หลัก · UQ = ห้ามซ้ำ · ตัวเอียง = ยอมให้ว่างได้</text>

  <!-- users -->
  <rect x="36" y="96" width="250" height="176" rx="10" fill="#FFFFFF" stroke="#0D7A4B" stroke-width="2"/>
  <rect x="36" y="96" width="250" height="30" rx="10" fill="#0D7A4B"/>
  <rect x="36" y="116" width="250" height="10" fill="#0D7A4B"/>
  <text x="48" y="117" font-size="14" font-weight="700" fill="#FFFFFF">users</text>
  <text x="48" y="146" font-size="11.5" fill="#17241D">PK username</text>
  <text x="48" y="164" font-size="11.5" fill="#17241D">   password_hash (bcrypt 12)</text>
  <text x="48" y="182" font-size="11.5" fill="#17241D">UQ email</text>
  <text x="48" y="200" font-size="11.5" fill="#17241D">   role ENUM(admin, staff)</text>
  <text x="48" y="218" font-size="11.5" fill="#17241D">   is_active</text>
  <text x="48" y="236" font-size="11.5" fill="#DC4C5C">   token_version ← เตะ session</text>
  <text x="48" y="256" font-size="11" fill="#66766E">   last_login_at, password_changed_at</text>

  <!-- password_reset_otps -->
  <rect x="36" y="310" width="250" height="150" rx="10" fill="#FFFFFF" stroke="#66766E" stroke-width="2"/>
  <rect x="36" y="310" width="250" height="30" rx="10" fill="#66766E"/>
  <rect x="36" y="330" width="250" height="10" fill="#66766E"/>
  <text x="48" y="331" font-size="14" font-weight="700" fill="#FFFFFF">password_reset_otps</text>
  <text x="48" y="360" font-size="11.5" fill="#17241D">PK id CHAR(36)</text>
  <text x="48" y="378" font-size="11.5" fill="#17241D">FK username → users</text>
  <text x="48" y="396" font-size="11.5" fill="#17241D">   otp_hash CHAR(64) HMAC</text>
  <text x="48" y="414" font-size="11.5" fill="#17241D">UQ reset_token_hash</text>
  <text x="48" y="432" font-size="11.5" fill="#17241D">   expires_at, attempts</text>
  <text x="48" y="450" font-size="11" fill="#66766E">   ON DELETE CASCADE</text>

  <!-- rooms -->
  <rect x="452" y="96" width="276" height="158" rx="10" fill="#FFFFFF" stroke="#0D7A4B" stroke-width="2.5"/>
  <rect x="452" y="96" width="276" height="30" rx="10" fill="#0D7A4B"/>
  <rect x="452" y="116" width="276" height="10" fill="#0D7A4B"/>
  <text x="464" y="117" font-size="14" font-weight="700" fill="#FFFFFF">rooms · ศูนย์กลางของระบบ</text>
  <text x="464" y="146" font-size="11.5" fill="#17241D">PK room_number VARCHAR(20)</text>
  <text x="464" y="164" font-size="11" fill="#66766E">   ข้อความ ไม่ใช่ตัวเลข เพราะมี CL503</text>
  <text x="464" y="184" font-size="11.5" fill="#17241D">   floor_number, room_index</text>
  <text x="464" y="202" font-size="11" fill="#66766E">   เก็บแยกเพราะห้องพิเศษแกะจากชื่อไม่ได้</text>
  <text x="464" y="222" font-size="11.5" fill="#17241D">   room_type VARCHAR ไม่ใช่ ENUM</text>
  <text x="464" y="240" font-size="11" fill="#66766E">   ลบห้อง = ลบแถวจริง (ไม่มีคอลัมน์ซ่อน)</text>

  <!-- class_schedules -->
  <rect x="878" y="96" width="266" height="158" rx="10" fill="#FFFFFF" stroke="#C97A1B" stroke-width="2"/>
  <rect x="878" y="96" width="266" height="30" rx="10" fill="#C97A1B"/>
  <rect x="878" y="116" width="266" height="10" fill="#C97A1B"/>
  <text x="890" y="117" font-size="14" font-weight="700" fill="#FFFFFF">class_schedules</text>
  <text x="890" y="146" font-size="11.5" fill="#17241D">PK id CHAR(36)</text>
  <text x="890" y="164" font-size="11.5" fill="#17241D">FK room_number → rooms</text>
  <text x="890" y="182" font-size="11.5" fill="#17241D">   day_of_week TINYINT</text>
  <text x="890" y="200" font-size="11.5" fill="#17241D">   start_time / end_time TIME</text>
  <text x="890" y="220" font-size="11" fill="#66766E">   TIME ไม่ใช่ DATETIME</text>
  <text x="890" y="238" font-size="11" fill="#66766E">   เพราะซ้ำทุกสัปดาห์</text>

  <!-- air_conditioners -->
  <rect x="404" y="330" width="372" height="286" rx="10" fill="#FFFFFF" stroke="#DC4C5C" stroke-width="2.5"/>
  <rect x="404" y="330" width="372" height="30" rx="10" fill="#DC4C5C"/>
  <rect x="404" y="350" width="372" height="10" fill="#DC4C5C"/>
  <text x="416" y="351" font-size="14" font-weight="700" fill="#FFFFFF">air_conditioners · 37 คอลัมน์</text>

  <text x="416" y="380" font-size="11" font-weight="700" fill="#DC4C5C">ตัวตนและตำแหน่ง</text>
  <text x="416" y="398" font-size="11.5" fill="#17241D">PK device_id (จาก MAC ใน eFuse)</text>
  <text x="416" y="416" font-size="11.5" fill="#17241D">FK room_number → rooms</text>
  <text x="416" y="434" font-size="11.5" fill="#17241D">UQ (room_number, air_number)</text>
  <text x="416" y="450" font-size="10.5" fill="#66766E">   กันสองบอร์ดแย่งตำแหน่งเดียวกัน</text>

  <text x="416" y="476" font-size="11" font-weight="700" fill="#DC4C5C">การเชื่อมต่อ</text>
  <text x="416" y="494" font-size="11.5" fill="#17241D">   protocol, mqtt_host/port/topic</text>
  <text x="416" y="512" font-size="11.5" fill="#17241D">   provision_status (reserved/active)</text>
  <text x="416" y="528" font-size="10.5" fill="#66766E">   ถอด = ลบแถว ประวัติค่าไฟยังอยู่ใน energy_hourly</text>

  <text x="416" y="554" font-size="11" font-weight="700" fill="#DC4C5C">ค่าที่วัดได้ · DECIMAL ไม่ใช่ FLOAT</text>
  <text x="416" y="572" font-size="11.5" fill="#17241D">   voltage, current_amp, power_watts</text>
  <text x="416" y="590" font-size="11.5" fill="#17241D">   energy_kwh, frequency_hz, power_factor</text>
  <text x="416" y="606" font-size="10.5" fill="#66766E">   NULL = อ่านไม่ได้ · 0 = อ่านได้และเป็นศูนย์</text>

  <!-- auto off box -->
  <rect x="404" y="634" width="372" height="112" rx="10" fill="#FFF0DC" stroke="#C97A1B" stroke-width="2"/>
  <text x="416" y="656" font-size="11.5" font-weight="700" fill="#C97A1B">6 คอลัมน์ auto_off_* ในตารางเดียวกัน</text>
  <text x="416" y="676" font-size="11" fill="#17241D">auto_off_enabled · started_at · deadline_at</text>
  <text x="416" y="694" font-size="11" fill="#17241D">attempts · last_attempt_at · in_class</text>
  <text x="416" y="716" font-size="10.5" fill="#66766E">เก็บ "เวลาที่จะครบ" ไม่ใช่ "เหลืออีกกี่วินาที"</text>
  <text x="416" y="734" font-size="10.5" fill="#66766E">จึงเขียน DB ครั้งเดียว ไม่ต้องลบทีละวินาที</text>

  <!-- occupancy_sensors -->
  <rect x="854" y="330" width="290" height="190" rx="10" fill="#FFFFFF" stroke="#4678B8" stroke-width="2"/>
  <rect x="854" y="330" width="290" height="30" rx="10" fill="#4678B8"/>
  <rect x="854" y="350" width="290" height="10" fill="#4678B8"/>
  <text x="866" y="351" font-size="14" font-weight="700" fill="#FFFFFF">occupancy_sensors</text>
  <text x="866" y="380" font-size="11.5" fill="#17241D">PK device_id (OCC32-...)</text>
  <text x="866" y="398" font-size="11.5" fill="#17241D">FK room_number → rooms</text>
  <text x="866" y="416" font-size="11.5" fill="#17241D">UQ room_number ← 1 ห้อง 1 ตัว</text>
  <text x="866" y="434" font-size="11.5" fill="#17241D">   static_threshold DEFAULT 25</text>
  <text x="866" y="458" font-size="11.5" font-weight="700" fill="#4678B8">   บูลีน 3 ตัวที่ห้ามรวมกัน</text>
  <text x="866" y="476" font-size="11.5" fill="#17241D">   is_online · radar_available · is_occupied</text>
  <text x="866" y="496" font-size="10.5" fill="#66766E">   แยก "ไม่มีคน" ออกจาก "ไม่รู้ว่ามีคนไหม"</text>
  <text x="866" y="512" font-size="10.5" fill="#DC4C5C">   ถ้ารวมกัน = ปิดแอร์ใส่คนที่นั่งอยู่</text>

  <!-- energy_hourly -->
  <rect x="36" y="560" width="340" height="240" rx="10" fill="#FFFFFF" stroke="#0D7A4B" stroke-width="2.5"/>
  <rect x="36" y="560" width="340" height="30" rx="10" fill="#0D7A4B"/>
  <rect x="36" y="580" width="340" height="10" fill="#0D7A4B"/>
  <text x="48" y="581" font-size="14" font-weight="700" fill="#FFFFFF">energy_hourly · ถังรายชั่วโมง</text>
  <text x="48" y="610" font-size="11.5" fill="#17241D">PK (device_id, bucket_start)</text>
  <text x="48" y="628" font-size="10.5" fill="#66766E">   คีย์ประกอบ ทำให้ UPSERT ได้ในคำสั่งเดียว</text>
  <text x="48" y="650" font-size="11.5" fill="#17241D">   sample_count / pzem_samples / running_samples</text>
  <text x="48" y="666" font-size="10.5" fill="#66766E">   ต้องมี 3 ตัว ไม่ใช่ตัวเดียว</text>
  <text x="48" y="688" font-size="11.5" fill="#17241D">   voltage_sum / current_sum / power_sum ...</text>
  <text x="48" y="704" font-size="10.5" fill="#66766E">   เก็บผลรวม ไม่เก็บค่าเฉลี่ย เพราะเฉลี่ยบวกกันไม่ได้</text>
  <text x="48" y="726" font-size="11.5" fill="#17241D">   consumption_kwh, energy_start/end_kwh</text>
  <text x="48" y="744" font-size="11.5" fill="#17241D">   runtime_seconds, online_seconds</text>
  <text x="48" y="766" font-size="10.5" fill="#DC4C5C">   40 เครื่อง: 1.7 ล้านแถว/วัน → 960 แถว/วัน</text>
  <text x="48" y="784" font-size="10.5" fill="#66766E">   room_number/device_name เก็บซ้ำไว้ตั้งใจ</text>

  <!-- system_alerts -->
  <rect x="854" y="560" width="290" height="168" rx="10" fill="#FFFFFF" stroke="#C97A1B" stroke-width="2"/>
  <rect x="854" y="560" width="290" height="30" rx="10" fill="#C97A1B"/>
  <rect x="854" y="580" width="290" height="10" fill="#C97A1B"/>
  <text x="866" y="581" font-size="14" font-weight="700" fill="#FFFFFF">system_alerts</text>
  <text x="866" y="610" font-size="11.5" fill="#17241D">PK id CHAR(36)</text>
  <text x="866" y="628" font-size="11.5" fill="#17241D">   kind ENUM ← รหัส ไม่ใช่ข้อความ</text>
  <text x="866" y="646" font-size="10.5" fill="#66766E">   แอปเลือกภาษาและถ้อยคำเอง</text>
  <text x="866" y="666" font-size="11.5" fill="#17241D">   status (open/acknowledged/resolved)</text>
  <text x="866" y="684" font-size="11.5" fill="#17241D">   room_number, device_id, device_name</text>
  <text x="866" y="704" font-size="10.5" fill="#66766E">   idx (status, kind, room, device)</text>
  <text x="866" y="720" font-size="10.5" fill="#66766E">   กันสร้างใบซ้ำทุก 10 วินาที</text>

  <!-- system_settings -->
  <rect x="854" y="752" width="290" height="106" rx="10" fill="#FFFFFF" stroke="#66766E" stroke-width="2"/>
  <rect x="854" y="752" width="290" height="30" rx="10" fill="#66766E"/>
  <rect x="854" y="772" width="290" height="10" fill="#66766E"/>
  <text x="866" y="773" font-size="14" font-weight="700" fill="#FFFFFF">system_settings</text>
  <text x="866" y="802" font-size="11.5" fill="#17241D">PK setting_key · setting_value</text>
  <text x="866" y="820" font-size="11.5" fill="#17241D">   updated_by, updated_at</text>
  <text x="866" y="840" font-size="10.5" fill="#66766E">   คู่คีย์-ค่า เพิ่มค่าใหม่ไม่ต้อง ALTER TABLE</text>

  <!-- FK lines -->
  <path d="M161,306 L161,272" stroke="#4678B8" stroke-width="2" fill="none" marker-end="url(#fk)"/>
  <path d="M874,175 L732,175" stroke="#4678B8" stroke-width="2" fill="none" marker-end="url(#fk)"/>
  <path d="M590,326 L590,258" stroke="#4678B8" stroke-width="2" fill="none" marker-end="url(#fk)"/>
  <path d="M850,404 L780,404 L780,300 L724,300 L724,258" stroke="#4678B8" stroke-width="2" fill="none" marker-end="url(#fk)"/>

  <!-- energy link (logical, not FK) -->
  <path d="M380,640 L400,640" stroke="#66766E" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <text x="150" y="822" font-size="10.5" fill="#66766E">energy_hourly ไม่มี FK ไปหา air_conditioners โดยตั้งใจ</text>
  <text x="150" y="838" font-size="10.5" fill="#66766E">ประวัติต้องอยู่ต่อได้แม้อุปกรณ์ถูกนำออกจากระบบ</text>
</svg>
