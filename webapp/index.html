<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#060d09">
<meta name="description" content="ระบบติดตามและควบคุมการใช้พลังงานของเครื่องปรับอากาศ อาคาร 16 มทร.ธัญบุรี">
<title>RMUTT Save Energy — ระบบประหยัดพลังงาน อาคาร 16</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230E1B14'/%3E%3Cpath d='M13 3 5 14h6l-1 7 8-11h-6l1-7Z' fill='%233ECF8E'/%3E%3C/svg%3E">

<!--
  ฟอนต์จาก Google Fonts เป็นของเสริมเท่านั้น
  ถ้าเครือข่ายเข้าไม่ถึง ตัวหนังสือจะถอยไปใช้ฟอนต์ไทยที่มีในเครื่อง
  (Sarabun / Leelawadee UI / Tahoma) ตามที่ประกาศไว้ใน tokens.css
  ตัวไทยหลักคือ IBM Plex Sans Thai เพราะอ่านง่ายกว่าที่ขนาดเล็กบนจอ
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

<!--
  ?v= บังคับให้เบราว์เซอร์โหลด CSS ใหม่หลัง deploy (ไฟล์ใน /assets ถูกแคชหนึ่งชั่วโมง)
  แก้หน้าตาเมื่อไร ให้เปลี่ยนเลขนี้ทั้งสี่บรรทัดและที่ main.js ด้านล่าง
-->
<link rel="stylesheet" href="assets/css/tokens.css?v=4.0">
<link rel="stylesheet" href="assets/css/base.css?v=4.0">
<link rel="stylesheet" href="assets/css/components.css?v=4.0">
<link rel="stylesheet" href="assets/css/views.css?v=4.0">
</head>
<body>

<div class="app" id="app" hidden>

  <!-- ================== แถบเมนูด้านข้าง ================== -->
  <aside class="sidebar" id="sidebar" aria-label="เมนูหลัก">
    <div class="brand">
      <div class="brand-mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#06150E"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">RMUTT Save<br>Energy</div>
        <div class="brand-sub user-role">อาคาร 16</div>
      </div>
    </div>

    <div class="nav-label">เมนูหลัก</div>
    <nav class="nav" id="navMain"></nav>

    <div class="nav-label" id="navSystemLabel">ระบบ</div>
    <nav class="nav" id="navSystem"></nav>

    <div class="sidebar-foot">
      <button class="user-chip" id="userChip" type="button"></button>
    </div>
  </aside>

  <!-- ================== ส่วนเนื้อหา ================== -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="เปิดเมนู"></button>
        <div>
          <h1 class="page-title" id="pageTitle">กำลังโหลด…</h1>
          <div class="page-sub" id="pageSub"></div>
          <div class="page-sub dim" id="todayLine"></div>
        </div>
      </div>
      <div class="topbar-right" id="topbarRight"></div>
    </header>

    <main class="view active" id="viewRoot"></main>
  </div>
</div>

<!-- ลิ้นชักควบคุมเครื่องปรับอากาศของห้องที่เลือก -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer" aria-label="รีโมตเครื่องปรับอากาศ"></aside>

<!-- ฉากทึบหลังเมนูตอนเปิดบนจอเล็ก -->
<div class="scrim" id="scrim"></div>

<noscript>
  <div style="padding:28px; font-family:sans-serif; color:#EAF6EE;">
    เว็บแอปนี้ต้องเปิดใช้งาน JavaScript จึงจะทำงานได้
    เพราะข้อมูลทั้งหมดดึงจาก API แบบสด ๆ
  </div>
</noscript>

<!-- สคริปต์อยู่ในไฟล์แยก เพราะ Content-Security-Policy ไม่อนุญาตสคริปต์ในหน้า -->
<script type="module" src="assets/js/main.js?v=4.0"></script>
