name: cpe_air_remote
description: RMUTT Save Energy air-conditioner control app for Building 16.
publish_to: "none"
version: 3.16.0+32

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.4
  flutter_blue_plus: 2.3.11
  flutter_blue_plus_winrt: 0.0.20
  file_selector: ^1.1.0
  http: ^1.2.2
  path_provider: ^2.1.4
  share_plus: ">=11.0.0 <14.0.0"
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

  # ฟอนต์หัวข้อและตัวเลขใหญ่ ตัวเดียวกับตัวหนังสือในโลโก้ (มีอักษรไทย)
  # สัญญาอนุญาต SIL Open Font License อยู่ที่ assets/fonts/ChakraPetch-OFL.txt
  fonts:
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
