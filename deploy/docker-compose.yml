name: rmutt

# จำกัดขนาด log ของทุก container ไม่ให้กินดิสก์จนเต็ม
# ค่าเริ่มต้นของ Docker ไม่จำกัดเลย ระบบที่รันยาว ๆ จะเต็มดิสก์ในไม่กี่เดือน
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: mariadb:11
    container_name: rmutt-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      # root ใช้เฉพาะงานดูแลระบบ (backup, db-view) Backend ไม่ใช้ root
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      # user ของแอป มีสิทธิ์เฉพาะฐานข้อมูล ${DB_DATABASE} เท่านั้น
      # (สร้างให้อัตโนมัติตอนรันครั้งแรกที่โฟลเดอร์ db/data ยังว่าง)
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Bangkok
    # เปิดพอร์ตเฉพาะ localhost ของเซิร์ฟเวอร์เท่านั้น เข้าจากเครือข่ายไม่ได้
    # ใช้ต่อ DBeaver/HeidiSQL ผ่าน SSH tunnel
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./db/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: rmutt-mqtt
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8883:8883"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      TZ: Asia/Bangkok
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      # dynamic-security.json (บัญชีของ Backend และของบอร์ดทุกตัว) อยู่ใน data
      - ./mosquitto/data:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h 127.0.0.1 -p 1883
          -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}"
          -t '$$SYS/broker/version' -C 1 -W 5
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    container_name: rmutt-backend
    restart: unless-stopped
    logging: *default-logging
    # ส่งเข้า Backend เฉพาะค่าที่ Backend ใช้จริง ไม่ใช้ `env_file: .env` ทั้งไฟล์
    # เพราะ .env มีรหัส root ของ MariaDB, token DuckDNS/Tailscale และรหัสแอดมินตัวแรก
    # ถ้าส่งไปทั้งไฟล์ ค่าพวกนั้นจะอยู่ใน container และเห็นได้จาก `docker inspect`
    # (ค่าใน ${...} ยังอ่านจาก .env ไฟล์เดิม ไม่ต้องแก้ .env บนเซิร์ฟเวอร์)
    # เพิ่มตัวแปรใหม่ให้ Backend เมื่อไร ต้องมาเพิ่มในรายการนี้ด้วย
    environment:
      NODE_ENV: production
      PORT: 3000
      # คำขอเข้ามาได้สองทาง: โดเมนหลัก (Caddy ชั้นเดียว) และ Tailscale Funnel
      # (Tailscale -> Caddy สองชั้น) ต้องเชื่อ X-Forwarded-For สองชั้น ไม่งั้นทุกคน
      # ที่เข้าผ่าน Funnel (รวมแอปมือถือ) จะถูกนับเป็น IP เดียวกัน คนหนึ่งพิมพ์รหัสผิด
      # 10 ครั้ง ทุกคนจะล็อกอินไม่ได้ 15 นาที
      # ทางโดเมนหลักปลอมไม่ได้ เพราะ Caddy ทิ้ง X-Forwarded-For ที่ผู้ใช้ส่งมาเอง
      TRUST_PROXY: 2
      # เว็บกับ API อยู่โดเมนเดียวกัน แอปมือถือไม่ถูกตรวจ CORS
      # PUBLIC_URL = ที่อยู่สาธารณะจาก Tailscale Funnel (เว้นว่างได้)
      APP_ORIGIN: https://${DOMAIN},${PUBLIC_URL:-}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-5}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      OTP_PEPPER: ${OTP_PEPPER}
      OTP_EXPIRES_MINUTES: ${OTP_EXPIRES_MINUTES:-10}
      MAIL_MODE: ${MAIL_MODE:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MQTT_URL: mqtt://mqtt:1883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      # ที่อยู่ที่ส่งให้ ESP32 ตอน provisioning (ต่างจากที่ Backend ใช้เอง)
      MQTT_DEVICE_URL: mqtts://${DOMAIN}:8883
      MQTT_REQUIRED: "true"
      # บอร์ดแต่ละตัวมีบัญชี MQTT ของตัวเอง เห็นเฉพาะ topic ของตัวเอง
      MQTT_DEVICE_AUTH: dynsec
      MQTT_DEVICE_SECRET: ${MQTT_DEVICE_SECRET}
      MQTT_TOPIC_PREFIX: rmutt/ac
      MQTT_OCCUPANCY_TOPIC_PREFIX: rmutt/occupancy
      LEGACY_PHONE_PREFIX: ${LEGACY_PHONE_PREFIX:-0}
      # โฟลเดอร์เดียวกับที่ Caddy เสิร์ฟ /firmware/ ใช้แสดงรายการไฟล์ในเว็บ
      FIRMWARE_DIR: /firmware
      TZ: Asia/Bangkok
    volumes:
      - ./firmware:/firmware:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health')
          .then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started

  caddy:
    # Caddy + ปลั๊กอิน DuckDNS (ดู caddy.Dockerfile)
    build:
      context: .
      dockerfile: caddy.Dockerfile
    image: rmutt-caddy:duckdns
    container_name: rmutt-caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # token จากหน้า duckdns.org ใช้เขียน TXT record ตอนขอใบรับรอง
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
      TZ: Asia/Bangkok
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv/www:ro
      # ไฟล์ .bin สำหรับอัปเดตเฟิร์มแวร์ ESP32 ผ่าน Wi-Fi
      - ./firmware:/srv/firmware:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      - backend

  # ทางเข้าจากอินเทอร์เน็ต (Tailscale Funnel) สำหรับเว็บและแอปเท่านั้น
  # - ต่อออกไปหา Tailscale เอง ไม่ต้องเปิดพอร์ตขาเข้าบน firewall ของมหาวิทยาลัย
  # - โหมด userspace: ไม่ต้องใช้ /dev/net/tun หรือสิทธิ์ NET_ADMIN ไม่แตะเครือข่ายของเครื่อง
  # - ส่งต่อเฉพาะไปที่ caddy:8080 (เว็บ + /api) ฐานข้อมูล MQTT และ SSH ไม่ถูกเปิดออก
  # - ปิดได้ทันที: docker compose stop tailscale
  tailscale:
    image: tailscale/tailscale:stable
    container_name: rmutt-tailscale
    hostname: rmutt-energy
    restart: unless-stopped
    logging: *default-logging
    environment:
      TS_HOSTNAME: rmutt-energy
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # เว้นว่างได้: ครั้งแรกให้ดูลิงก์ล็อกอินใน docker compose logs tailscale
      TS_AUTHKEY: ${TS_AUTHKEY:-}
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    depends_on:
      - caddy
