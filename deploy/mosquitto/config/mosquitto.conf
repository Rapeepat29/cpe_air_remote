# Mosquitto สำหรับใช้งานจริง
#
# ยืนยันตัวตนและกำหนดสิทธิ์ด้วย Dynamic Security Plugin
#   - Backend ใช้บัญชี MQTT_USERNAME (สร้างโดย init-env.sh)
#   - บอร์ด ESP32 แต่ละตัวมีบัญชีของตัวเอง (username = Device ID)
#     Backend สร้างให้อัตโนมัติตอนจองช่อง และลบให้ตอนถอดอุปกรณ์
#   - บอร์ดเห็นและส่งได้เฉพาะ topic ของตัวเอง สั่งแอร์ห้องอื่นไม่ได้
#
# บรรทัด plugin ถูกตั้ง path ให้ตรงกับ image โดย init-env.sh

# Dynamic Security ต้องใช้กติกาเดียวกันทุก listener
per_listener_settings false
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# ภายใน docker network เท่านั้น (ไม่ publish port) ใช้โดย Backend
listener 1883 0.0.0.0
protocol mqtt

# สำหรับ ESP32 ที่เข้ามาจากเครือข่าย ต้องเป็น TLS เสมอ
listener 8883 0.0.0.0
protocol mqtt
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# ส่ง log ออก stdout อย่างเดียว ให้ Docker หมุนไฟล์และจำกัดขนาดเอง
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
