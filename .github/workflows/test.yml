# ตรวจโค้ดแอปทุกครั้งที่ push: flutter analyze + flutter test (เครื่อง Linux ไม่กินโควตา macOS)
name: ทดสอบแอป Flutter

on:
  push:
    paths: ['lib/**', 'test/**', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/test.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # ผลลัพธ์ส่งออกเป็น annotation ด้วย จะได้เห็นในหน้า Summary โดยไม่ต้องเปิด log
      - name: flutter analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt || {
            grep -E ' (error|warning) • ' analyze.txt | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          grep -E ' warning • ' analyze.txt | head -20 | while IFS= read -r line; do echo "::warning::$line"; done
      - name: flutter test
        if: always()
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.txt || {
            grep -E '\[E\]|Expected:|Actual:|Error:|error:' test.txt | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
